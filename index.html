<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מירוץ על המסלול שלי</title>
<style>
:root{--bg:#14171c;--panel:#222831;--fg:#f2f4f7;--acc:#ffb703;--ok:#4ade80;--bad:#ff6b6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
#stage{position:relative;width:100%;height:100%}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#c3d{display:none}
.bar{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;z-index:5}
button{background:var(--panel);color:var(--fg);border:1px solid #3a4452;border-radius:10px;padding:10px 14px;font-size:15px;cursor:pointer;font-family:inherit}
button.go{background:var(--acc);color:#111;border-color:var(--acc);font-weight:700}
button:disabled{opacity:.4;cursor:default}
#msg{position:absolute;bottom:18px;left:0;right:0;text-align:center;font-size:17px;padding:0 12px;z-index:5;pointer-events:none}
#hud{position:absolute;top:60px;right:12px;z-index:5;display:none;font-size:15px;background:#000a;padding:8px 12px;border-radius:10px;line-height:1.7}
#hud b{font-size:26px;color:var(--acc)}
#touch{position:absolute;bottom:14px;left:10px;right:10px;display:none;justify-content:space-between;z-index:6}
#touch div{display:flex;gap:10px}
#touch button{width:74px;height:74px;font-size:28px;border-radius:50%;opacity:.8;touch-action:none}
#shop{position:absolute;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:20}
#shop .box{background:var(--panel);border-radius:16px;padding:16px;width:min(440px,92vw);max-height:88%;display:flex;flex-direction:column;gap:10px}
#shop h2{margin:0}
#shop .mny{color:var(--acc);font-size:20px}
#shop .list{overflow-y:auto;display:flex;flex-direction:column;gap:8px}
#shop .row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#2c3540;border-radius:10px;padding:8px 12px}
#shop .row.sel{outline:2px solid var(--acc)}
#shop small{display:block;opacity:.7}
#shop .seg{display:flex;gap:8px;flex-wrap:wrap}
#shop input{background:#2c3540;color:var(--fg);border:1px solid #3a4452;border-radius:10px;padding:10px;font-size:16px;width:130px;min-width:0;text-transform:lowercase}
#shop .box>div{line-height:1.5}
#vdiv{position:absolute;top:0;bottom:0;left:50%;width:4px;margin-left:-2px;background:#fff;z-index:4;display:none;pointer-events:none}
#shud{position:absolute;top:58px;left:0;right:0;display:none;z-index:5;pointer-events:none;font-size:15px;font-weight:700;text-shadow:0 2px 4px #000}
#shud span{position:absolute;top:0;width:50%;text-align:center}
#sh2{left:0}
#sh1{left:50%}
#thud{position:absolute;top:60px;left:12px;z-index:5;display:none;font-size:14px;background:#000a;padding:8px 12px;border-radius:10px;line-height:1.7;pointer-events:none;max-width:46vw}
#shop svg{width:100%;max-height:110px;border-radius:8px}
#shop .kb{direction:ltr;text-align:center}
#shop .kb div{display:flex;justify-content:center}
#shop .kb span{display:inline-block;min-width:44px;margin:3px;padding:8px;border:2px solid #3a4452;border-radius:8px;background:#2c3540;font-weight:700;text-align:center}
#shop .kb span.on{background:var(--acc);color:#111;border-color:var(--acc);transform:translateY(2px)}
#shop .kb .sp{min-width:160px}
#shop.pod{background:transparent;align-items:flex-end;pointer-events:none}
#shop.pod .box{pointer-events:auto;margin-bottom:12px}
#dash{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:5;display:none;background:#000b;padding:6px 14px;border-radius:12px;text-align:center;pointer-events:none;min-width:150px;direction:ltr}
#dled{display:flex;gap:3px;justify-content:center;margin-bottom:4px}
#dled i{width:9px;height:9px;border-radius:50%;background:#222;display:inline-block}
#dgear{font-size:34px;font-weight:800;line-height:1}
#dspd{font-size:15px;opacity:.9}
#dtag{font-size:12px;height:14px;font-weight:700}
#shop .st{padding:6px 8px;border-radius:8px;border:1px solid transparent}
#shop .st.on{background:#2c3540;border-color:var(--acc)}
#itembox{position:absolute;bottom:110px;left:0;right:0;text-align:center;font-size:46px;pointer-events:none;z-index:5;text-shadow:0 2px 8px #000}
#speedfx{position:absolute;inset:0;pointer-events:none;z-index:3;opacity:0;background:repeating-conic-gradient(from 0deg at 50% 50%,transparent 0deg 5deg,rgba(255,255,255,.35) 5deg 5.6deg);-webkit-mask-image:radial-gradient(circle at 50% 50%,transparent 38%,#000 85%);mask-image:radial-gradient(circle at 50% 50%,transparent 38%,#000 85%)}
#count{position:absolute;top:26%;left:0;right:0;text-align:center;font-size:96px;font-weight:800;color:#fff;opacity:0;z-index:9;pointer-events:none;text-shadow:0 4px 12px #000}
#toast{position:absolute;top:38%;left:0;right:0;text-align:center;font-size:30px;font-weight:700;color:var(--ok);opacity:0;transition:opacity .4s;z-index:8;pointer-events:none;text-shadow:0 2px 6px #000}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c2d"></canvas>
  <canvas id="c3d"></canvas>
  <div class="bar" id="barDraw">
    <button id="bClear">🗑️ נקה</button>
    <button id="bDemo">✨ מסלול לדוגמה</button>
    <button id="bShop1">🛒 חנות</button>
    <button id="bSet1">⚙️ הגדרות</button>
    <button id="bWorld">🌍 עולם</button>
    <button id="bOpen">↔️ מסלול: סגור</button>
    <button id="bTrain">🎓 אימון</button>
    <button id="bObs" disabled>🚧 מכשולים 0/20</button>
    <button id="bSplit" disabled>🎮 שני שחקנים</button>
    <button id="bDuel">👥 1 נגד 1</button>
    <button id="bPit" disabled>🛠️ תחנות עצירה 0/5</button>
    <button id="bGo" class="go" disabled>🏁 סע!</button>
  </div>
  <div class="bar" id="barDrive" style="display:none">
    <button id="bEdit">✏️ ערוך מסלול</button>
    <button id="bReset">↺ אתחל (R)</button>
    <button id="bShop2">🛒 חנות</button>
    <button id="bSet2">⚙️ הגדרות</button>
    <button id="bHelp" style="display:none">❓ הסבר</button>
    <button id="bFP">👁️ מבט נהג (F)</button>
    <button id="bSnd">🔊</button>
  </div>
  <div id="hud"><b id="spd">0</b> קמ״ש<br>הקפה: <span id="lap">0</span> · זמן: <span id="tm">0.0</span>s<br>שיא: <span id="best">–</span><br>💰 <b id="money" style="font-size:20px">0</b> ₪<div id="rhud" style="display:none">🏁 מקום <b id="pos">–</b>/<span id="ptot">12</span><br><span id="outn"></span></div></div>
  <div id="msg">צייר עם האצבע או העכבר מסלול סגור – התחל והסתיים בעיגול הירוק</div>
  <div id="toast"></div>
  <div id="count"></div>
  <div id="vdiv"></div>
  <div id="speedfx"></div>
  <div id="thud"></div>
  <div id="itembox"></div>
  <div id="dash"><div id="dled"></div><div id="dgear">N</div><div id="dspd">0 KM/H</div><div id="dtag"></div></div>
  <div id="shud"><span id="sh2"></span><span id="sh1"></span></div>
  <div id="shop"></div>
  <div id="touch">
    <div><button id="tL">◀</button><button id="tR">▶</button></div>
    <div><button id="tE">🎁</button><button id="tF">👁</button><button id="tH">💨</button><button id="tB">⏹</button><button id="tG">▲</button></div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const c2=$('c2d'),x2=c2.getContext('2d'),c3=$('c3d');
let mode='draw',raw=[],track=null,drawing=false,closedOK=false;

function fit(){const d=window.devicePixelRatio||1;c2.width=c2.clientWidth*d;c2.height=c2.clientHeight*d;x2.setTransform(d,0,0,d,0,0);
  if(renderer){renderer.setSize(c3.clientWidth,c3.clientHeight,false);camera.aspect=c3.clientWidth/c3.clientHeight;camera.updateProjectionMatrix();}
  if(mode==='draw')redraw();}
function say(t,bad){const m=$('msg');m.textContent=t;m.style.color=bad?'var(--bad)':'var(--fg)';}

/* ---------- geometry helpers ---------- */
function resample(P,sp){
  const n=P.length,seg=[];let L=0;
  for(let i=0;i<n;i++){const a=P[i],b=P[(i+1)%n],d=Math.hypot(b.x-a.x,b.y-a.y);seg.push(d);L+=d;}
  const m=Math.max(12,Math.round(L/sp)),st=L/m,out=[];let i=0,acc=0;
  for(let k=0;k<m;k++){const t=k*st;while(i<n-1&&acc+seg[i]<t){acc+=seg[i];i++;}
    const a=P[i],b=P[(i+1)%n],f=(t-acc)/(seg[i]||1);out.push({x:a.x+(b.x-a.x)*f,y:a.y+(b.y-a.y)*f});}
  return out;
}
function smooth(P,passes){
  for(let k=0;k<passes;k++){const n=P.length;P=P.map((p,i)=>{const a=P[(i+n-1)%n],b=P[(i+1)%n];return{x:(a.x+2*p.x+b.x)/4,y:(a.y+2*p.y+b.y)/4};});}
  return P;
}
function segX(a,b,c,d){
  const o=(p,q,r)=>(q.x-p.x)*(r.y-p.y)-(q.y-p.y)*(r.x-p.x);
  return o(a,b,c)*o(a,b,d)<0&&o(c,d,a)*o(c,d,b)<0;
}
function selfCross(P){
  const n=P.length;
  for(let i=0;i<n;i++)for(let j=i+2;j<n;j++){
    if(i===0&&j===n-1)continue;
    if(segX(P[i],P[(i+1)%n],P[j],P[(j+1)%n]))return true;
  }
  return false;
}

/* ---------- drawing screen ---------- */
function redraw(){
  const w=c2.clientWidth,h=c2.clientHeight;
  x2.clearRect(0,0,w,h);
  x2.fillStyle='#1c2a1f';x2.fillRect(0,0,w,h);
  x2.strokeStyle='#ffffff10';x2.lineWidth=1;
  for(let x=0;x<w;x+=40){x2.beginPath();x2.moveTo(x,0);x2.lineTo(x,h);x2.stroke();}
  for(let y=0;y<h;y+=40){x2.beginPath();x2.moveTo(0,y);x2.lineTo(w,y);x2.stroke();}
  const pts=closedOK?track2d:raw;
  if(raw.length){
    const s=raw[0];
    if(!closedOK&&!openMode){x2.beginPath();x2.arc(s.x,s.y,45,0,7);x2.fillStyle='#4ade8033';x2.fill();x2.strokeStyle='#4ade80';x2.lineWidth=2;x2.stroke();}
  }
  if(pts&&pts.length>1){
    x2.lineJoin=x2.lineCap='round';
    const path=()=>{x2.beginPath();pts.forEach((p,i)=>i?x2.lineTo(p.x,p.y):x2.moveTo(p.x,p.y));if(closedOK&&!isOpen)x2.closePath();};
    path();x2.strokeStyle=closedOK?'#555c66':'#ffb703';x2.lineWidth=closedOK?22:4;x2.stroke();
    if(closedOK){path();x2.strokeStyle='#fff';x2.lineWidth=2;x2.setLineDash([10,12]);x2.stroke();x2.setLineDash([]);
      x2.beginPath();x2.arc(pts[0].x,pts[0].y,9,0,7);x2.fillStyle='#fff';x2.fill();
      if(isOpen){const e=pts[pts.length-1];x2.beginPath();x2.arc(e.x,e.y,11,0,7);x2.fillStyle='#e63946';x2.fill();x2.fillStyle='#fff';x2.font='bold 11px system-ui';x2.textAlign='center';x2.textBaseline='middle';x2.fillText('🏁',e.x,e.y+1);}
      pits.forEach(q=>{const p=pts[q.i];x2.beginPath();x2.arc(p.x,p.y,15,0,7);x2.fillStyle='#1d4ed8';x2.fill();x2.strokeStyle='#fff';x2.lineWidth=2;x2.setLineDash([]);x2.stroke();x2.fillStyle='#fff';x2.font='bold 15px system-ui';x2.textAlign='center';x2.textBaseline='middle';x2.fillText('P',p.x,p.y+1);});
      obstacles.forEach(o=>{const q=obsPos2d(o);x2.beginPath();if(o.t==='wall'){x2.rect(q.x-7,q.y-7,14,14);x2.fillStyle='#e63946';}else{x2.arc(q.x,q.y,7,0,7);x2.fillStyle='#ff9f1c';}x2.fill();x2.strokeStyle='#fff';x2.lineWidth=2;x2.stroke();});}
  }
}
let track2d=null;
function finish(){if(openMode){finishOpen();return;}
  if(raw.length<12){say('המסלול קצר מדי – נסה שוב',1);raw=[];redraw();return;}
  const gap=Math.hypot(raw[0].x-raw.at(-1).x,raw[0].y-raw.at(-1).y);
  if(gap>60){say('המסלול לא סגור! חבר את הקצה חזרה לעיגול הירוק ונסה שוב',1);return;}
  let P=resample(raw,14);P=smooth(P,6);
  if(selfCross(P)){say('המסלול חותך את עצמו – צייר לולאה בלי הצטלבויות',1);closedOK=false;return;}
  isOpen=false;track2d=P;closedOK=true;pits=[];pitMode=false;obstacles=[];obsMode=0;trainType=null;updPit();$('bGo').disabled=false;
  say('המסלול סגור ✓ אפשר להוסיף תחנות עצירה (🛠️) או ללחוץ סע');redraw();
}
c2.addEventListener('pointerdown',e=>{
  if(mode!=='draw')return;
  if(pitMode){pitClick(e.offsetX,e.offsetY);return;}
  if(obsMode){obsClick(e.offsetX,e.offsetY);return;}
  c2.setPointerCapture(e.pointerId);drawing=true;closedOK=false;pits=[];pitMode=false;obstacles=[];obsMode=0;trainType=null;updPit();$('bGo').disabled=true;
  raw=[{x:e.offsetX,y:e.offsetY}];say(openMode?'מצייר מסלול פתוח... עזוב את האצבע בנקודת הסיום':'ממשיך לצייר… סגור את הלולאה בעיגול הירוק');redraw();
});
c2.addEventListener('pointermove',e=>{
  if(!drawing)return;const l=raw.at(-1);
  if(Math.hypot(e.offsetX-l.x,e.offsetY-l.y)>8){raw.push({x:e.offsetX,y:e.offsetY});redraw();}
});
const up=()=>{if(!drawing)return;drawing=false;finish();};
c2.addEventListener('pointerup',up);c2.addEventListener('pointercancel',up);
$('bClear').onclick=()=>{raw=[];track2d=null;closedOK=false;pits=[];pitMode=false;obstacles=[];obsMode=0;trainType=null;updPit();$('bGo').disabled=true;say('צייר עם האצבע או העכבר מסלול סגור – התחל והסתיים בעיגול הירוק');redraw();};
$('bDemo').onclick=()=>{
  const w=c2.clientWidth,h=c2.clientHeight,s=Math.min(w,h)*.3;raw=[];
  for(let i=0;i<90;i++){const t=i/90*Math.PI*2,r=1+.3*Math.sin(3*t)+.12*Math.cos(5*t);
    raw.push({x:w/2+Math.cos(t)*s*1.5*r,y:h/2+Math.sin(t)*s*r});}
  finish();
};

/* ---------- 3D ---------- */
let renderer,camera,scene,T,Nn,W=8,car,raf,last,keys={},lap=0,lapT=0,best=null,lastIdx=0,half=false,shopOpen=false;
const CARS=[
 {n:'עירונית קטנה',p:0,col:0x4cc9f0,max:70,acc:50,turn:2.0,len:3.6,wid:1.8,hgt:.7},
 {n:'האצ׳בק ספורטיבי',p:1500,col:0xe63946,max:88,acc:62,turn:2.1,len:4.0,wid:1.9,hgt:.75},
 {n:'קופה מהירה',p:4000,col:0xffb703,max:105,acc:72,turn:2.2,len:4.4,wid:2.0,hgt:.8},
 {n:'ג׳יפ גדול',p:7000,col:0x2a9d8f,max:118,acc:78,turn:2.1,len:5.2,wid:2.4,hgt:1.2},
 {n:'סופר-קאר',p:11000,col:0x9b5de5,max:135,acc:86,turn:2.3,len:4.8,wid:2.1,hgt:.65},
 {n:'היפר-קאר',p:17000,col:0xf15bb5,max:155,acc:92,turn:2.4,len:5.0,wid:2.2,hgt:.6},
 {n:'פורמולה 1 🏆',p:25000,col:0xd90429,max:178,acc:100,turn:2.7,len:5.0,wid:1.0,hgt:.5,f1:true}
];
let money=0,owned=[0],sel=0,gears={};
try{const s=JSON.parse(localStorage.getItem('raceSave')||'null');if(s){money=s.money|0;owned=Array.isArray(s.owned)?s.owned:[0];sel=s.sel|0;gears=s.gears||{};if(!CARS[sel]||!owned.includes(sel))sel=0;}}catch(e){}
function save(){try{localStorage.setItem('raceSave',JSON.stringify({money,owned,sel,gears}));}catch(e){}}
function showMoney(){$('money').textContent=money.toLocaleString('he-IL');}
function toast(t){const e=$('toast');e.textContent=t;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,1700);}
function makeCarOld(d){
  const g=new THREE.Group(),M=c=>new THREE.MeshBasicMaterial({color:c}),dk=M(0x15181d);
  const bx=(w,h,l,m,x,y,z)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,l),m);o.position.set(x,y,z);g.add(o);};
  let wr=.45,wx=d.wid/2,wl=.4;
  if(d.f1){wr=.55;wx=1.3;wl=.7;
    bx(.9,.5,d.len,M(d.col),0,.6,0);
    bx(.55,.3,1.8,M(d.col),0,.5,d.len/2+.7);
    bx(2.8,.1,.7,dk,0,.3,d.len/2+1.4);
    bx(2.2,.9,.12,dk,0,1.5,-d.len/2-.2);
    bx(.5,.4,.7,M(0xffffff),0,1.0,-.3);
  }else{
    bx(d.wid,d.hgt,d.len,M(d.col),0,.4+d.hgt/2,0);
    bx(d.wid*.82,.6,d.len*.5,dk,0,.4+d.hgt+.3,-.2);
  }
  const wg=new THREE.CylinderGeometry(wr,wr,wl,14),wz=d.len*.32;
  [[-wx,wz],[wx,wz],[-wx,-wz],[wx,-wz]].forEach(([x,z])=>{const w=new THREE.Mesh(wg,dk);w.rotation.z=Math.PI/2;w.position.set(x,wr,z);g.add(w);});
  return g;
}
function setCar(i){sel=i;save();if(mode==='drive'&&car){const o=car.mesh,m=makeCar(CARS[i]);m.position.copy(o.position);m.rotation.y=o.rotation.y;scene.remove(o);car.mesh=m;scene.add(m);}}
function renderShop(){
  const s=$('shop');
  s.innerHTML='<div class="box"><h2>🛒 חנות רכבים</h2><div class="mny">💰 '+money.toLocaleString('he-IL')+' ₪ · כל הקפה = 100 ₪</div><div class="list"></div><button id="shopClose" class="go">סגור</button></div>';
  const l=s.querySelector('.list');
  CARS.forEach((c,i)=>{
    const r=document.createElement('div');r.className='row'+(i===sel?' sel':'');
    r.innerHTML='<div><b>'+c.n+'</b><small>עד '+Math.round(c.max*2)+' קמ״ש · האצה '+c.acc+'</small></div>';
    const b=document.createElement('button');
    if(i===sel){b.textContent='נבחר ✓';b.disabled=true;}
    else if(owned.includes(i)){b.textContent='בחר';b.onclick=()=>{setCar(i);renderShop();};}
    else{b.textContent=c.p.toLocaleString('he-IL')+' ₪';b.disabled=money<c.p;b.onclick=()=>{money-=c.p;owned.push(i);setCar(i);showMoney();save();renderShop();};}
    r.appendChild(b);l.appendChild(r);
  });
  {const gs=document.createElement('div');gs.style.cssText='display:flex;flex-direction:column;gap:6px;border-top:1px solid #3a4452;padding-top:8px';
  gs.innerHTML='<b>⚙️ גירים לרכב הנבחר</b><small>'+CARS[sel].n+' · מהירות '+Math.round(CARS[sel].max*2)+' קמ״ש (גירים: +'+(gears[sel]||0)+')</small>';
  const sg=document.createElement('div');sg.className='seg';
  [[10,100,'⚙️ גיר +10 קמ״ש · 100 ₪'],[50,500,'🔩 גיר מיוחד +50 קמ״ש · 500 ₪']].forEach(([k,p,t])=>{const b=document.createElement('button');b.textContent=t;b.disabled=money<p;b.onclick=()=>buyGear(k,p);sg.appendChild(b);});

  car.v-=car.v*Math.min(.9,Math.abs(Math.sin(df2)))*.5*dt;
  car.x+=Math.sin(car.va)*car.v*dt;car.z+=Math.cos(car.va)*car.v*dt;pitLogic(dt,pi);
